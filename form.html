<!doctype html>
<html>
<head>
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="container">

        <form class="form">

            <h1>Đăng ký thông tin sinh viên</h1>

            <div>
                <label for="fullname">Họ và tên</label>
                <input id="fullname" name="fullname" type="text">
            </div>

            <div>
                <label>Giới tính</label>
                <select>
                    <option>Nam</option>
                    <option>Nữ</option>
                    <option>Khác</option>
                </select>
            </div>

            <div>
                <label>Địa chỉ</label>
                <textarea></textarea>
            </div>

            <div>
                <label for="accept-1">Chấp nhận điều khoản</label>
                <input id="accept-1" name="accept-1" type="checkbox">
            </div>

            <div>
                <input type="file">
            </div>

            <div>
                Bạn có độc thân không?

                <input name="sigle" type="radio"> Có
                <input name="sigle" type="radio"> Không
                <input name="sigle" type="radio"> Không biết
                <input name="sigle" type="radio"> Lốp
            </div>

            <div>
                <label>Mật khẩu</label>
                <input type="password">
            </div>

            <button>Xác nhận</button>

        </form>

    </div>

</body>
</html>
